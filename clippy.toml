disallowed-methods = [
    { path = "std::process::exit", reason = "skips restoring the terminal; return an error from main" },
    { path = "std::thread::sleep", reason = "the TUI waits on events: event::poll with a timeout" },
    { path = "std::process::Command::new", reason = "run git through mrg_core::repo::Repo" },
]
