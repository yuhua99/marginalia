[package]
name = "marginalia"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mrg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
