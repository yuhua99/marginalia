[package]
name = "marginalia"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mrg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = { version = "3.2.1", features = ["unicode"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
textwrap = "0.16.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
